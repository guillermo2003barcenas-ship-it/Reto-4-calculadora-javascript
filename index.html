<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="contenedor">
        <section class="calculadora" id="calculadora">

            <h1>Calculadora básica</h1>

            <input
                type="text"
                id="pantalla"
                class="pantalla"
                value="0"
                readonly
                aria-label="Pantalla de la calculadora"
            >

            <div class="botones">
                <button class="limpiar" onclick="limpiar()">C</button>
                <button class="operador" onclick="seleccionarOperacion('/')">÷</button>
                <button class="operador" onclick="seleccionarOperacion('*')">×</button>
                <button class="operador" onclick="seleccionarOperacion('-')">−</button>

                <button onclick="agregarNumero('7')">7</button>
                <button onclick="agregarNumero('8')">8</button>
                <button onclick="agregarNumero('9')">9</button>
                <button class="operador" onclick="seleccionarOperacion('+')">+</button>

                <button onclick="agregarNumero('4')">4</button>
                <button onclick="agregarNumero('5')">5</button>
                <button onclick="agregarNumero('6')">6</button>
                <button onclick="agregarDecimal()">.</button>

                <button onclick="agregarNumero('1')">1</button>
                <button onclick="agregarNumero('2')">2</button>
                <button onclick="agregarNumero('3')">3</button>
                <button class="resultado" onclick="calcular()">=</button>

                <button class="cero" onclick="agregarNumero('0')">0</button>
            </div>

            <p class="nota">Realiza tus operaciones fácilmente.</p>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
